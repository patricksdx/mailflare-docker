services:
  mailflare:
    build:
      context: https://github.com/hieunc229/mailflare.git#main
      dockerfile: Dockerfile
    image: mailflare:local
    restart: unless-stopped
    ports:
      - "25:25"     # inbound SMTP (point your domain's MX here)
    volumes:
      - mailflare-data:/data

volumes:
  mailflare-data:
